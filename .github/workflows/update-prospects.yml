```yaml
name: Update MLB Prospects

on:
  # Run daily at 4am ET (9am UTC)
  schedule:
    - cron: '0 9 * * *'
  
  # Allow manual trigger
  workflow_dispatch:
    inputs:
      year:
        description: 'Year to fetch (default: current year)'
        required: false
        default: ''

jobs:
  update-prospects:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4
      
      - name: Fetch prospects
        run: |
          if [ -n "${{ github.event.inputs.year }}" ]; then
            echo "Fetching prospects for year: ${{ github.event.inputs.year }}"
            python scripts/fetch_prospects.py ${{ github.event.inputs.year }}
          else
            echo "Fetching prospects for current year"
            python scripts/fetch_prospects.py
          fi
      
      - name: Check for changes
        id: check_changes
        run: |
          git diff --quiet data/ || echo "changed=true" >> $GITHUB_OUTPUT
      
      - name: Commit and push if changed
        if: steps.check_changes.outputs.changed == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/
          git commit -m "🔄 Auto-update MLB prospects - $(date +'%Y-%m-%d %H:%M UTC')"
          git push
      
      - name: No changes
        if: steps.check_changes.outputs.changed != 'true'
        run: echo "📊 No changes detected - prospects are up to date"
```
